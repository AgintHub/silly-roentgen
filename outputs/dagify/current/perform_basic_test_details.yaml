dag_type: plain_text
description: A simple workflow to perform a basic test operation and report results.
name: perform_basic_test
nodes:
  analyze_test_outcome:
    agent: false
    description: Evaluate the collected results against expected criteria to determine
      test success or failure.
    name: analyze_test_outcome
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on:
    - report_test_summary
    prompt: Analyze the test results to assess if the test passed or failed based
      on defined criteria. Provide a clear determination.
  collect_test_results:
    agent: false
    description: Gather and document the output or outcome of the test execution.
    name: collect_test_results
    nodes_depended_on:
    - execute_test_action
    nodes_dependent_on:
    - analyze_test_outcome
    prompt: Collect the raw results from the test action. Record all observations
      clearly and unambiguously.
  execute_test_action:
    agent: false
    description: Perform the actual test action or operation as defined.
    name: execute_test_action
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on:
    - collect_test_results
    prompt: Carry out the test action precisely as specified, using only the prepared
      environment and inputs provided. Do not reference any other information.
  initialize_test_environment:
    agent: false
    description: Set up all necessary conditions and parameters to start the test.
    name: initialize_test_environment
    nodes_depended_on: []
    nodes_dependent_on:
    - execute_test_action
    prompt: Prepare the environment and any necessary parameters required to perform
      the test. Confirm readiness without assuming prior context.
  report_test_summary:
    agent: false
    description: Summarize the entire test process and report the final outcome clearly.
    name: report_test_summary
    nodes_depended_on:
    - analyze_test_outcome
    nodes_dependent_on: []
    prompt: Compose a concise summary of the test purpose, execution, and results,
      including whether the test passed or failed.
