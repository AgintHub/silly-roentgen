dag_type: plain_text
description: A detailed workflow for writing a screenplay for a film about vampires
  and elves starring Chris Pratt, including concept development, character creation,
  plot structuring, scriptwriting of acts and scenes, and integration of starring
  role.
name: screenplay_vampires_elves_chrispratt
nodes:
  compile_full_screenplay:
    agent: false
    description: Combine all acts and scenes into a complete, formatted screenplay
      document.
    name: compile_full_screenplay
    nodes_depended_on:
    - write_act_1_scenes
    - write_act_2_scenes
    - write_act_3_scenes
    nodes_dependent_on: []
    prompt: Combine the Act 1, Act 2, and Act 3 scenes into a fully formatted screenplay
      draft for the vampire and elf film starring Chris Pratt. Ensure consistency
      and proper screenplay format.
  define_film_genre_and_tone:
    agent: false
    description: Decide the specific film genre (e.g., fantasy, horror, action-comedy)
      and overall tone for the screenplay featuring vampires and elves.
    name: define_film_genre_and_tone
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_basic_plot
    - develop_vampire_character_details
    - develop_elf_character_details
    - determine_chris_pratt_character_profile
    prompt: Specify the film genre and tone for a screenplay featuring vampires and
      elves, such as dark fantasy, action, adventure, or comedy. Describe the mood
      and style in 2-3 sentences.
  determine_chris_pratt_character_profile:
    agent: false
    description: Define the character that Chris Pratt will portray in the screenplay,
      including role, characteristics, and significance.
    name: determine_chris_pratt_character_profile
    nodes_depended_on:
    - define_film_genre_and_tone
    - establish_film_setting
    nodes_dependent_on:
    - outline_basic_plot
    - write_act_1_scenes
    - write_act_2_scenes
    - write_act_3_scenes
    prompt: Create a detailed character profile for the character played by Chris
      Pratt. Include role in story, personality traits, relationships with vampires
      and elves, and overall importance.
  develop_elf_character_details:
    agent: false
    description: Create detailed traits, motivations, and background for key elf characters.
    name: develop_elf_character_details
    nodes_depended_on:
    - define_film_genre_and_tone
    - establish_film_setting
    nodes_dependent_on:
    - outline_basic_plot
    - write_act_1_scenes
    - write_act_2_scenes
    - write_act_3_scenes
    prompt: Generate detailed character profiles for the main elf characters, including
      personality traits, strengths, weaknesses, backgrounds, and motivations matching
      the film's genre and setting.
  develop_vampire_character_details:
    agent: false
    description: Create detailed traits, motivations, and background for key vampire
      characters.
    name: develop_vampire_character_details
    nodes_depended_on:
    - define_film_genre_and_tone
    - establish_film_setting
    nodes_dependent_on:
    - outline_basic_plot
    - write_act_1_scenes
    - write_act_2_scenes
    - write_act_3_scenes
    prompt: Generate detailed character profiles for the main vampire characters,
      including personality traits, strengths, weaknesses, backgrounds, and motivations
      consistent with the film's genre and setting.
  establish_film_setting:
    agent: false
    description: Create the main setting(s) and world-building details where the vampires
      and elves story takes place.
    name: establish_film_setting
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_basic_plot
    - develop_vampire_character_details
    - develop_elf_character_details
    prompt: Describe the primary settings for the film about vampires and elves, including
      the world type (e.g., medieval fantasy realm, modern city, dystopian future),
      environment, and relevant lore in 3-5 sentences.
  outline_basic_plot:
    agent: false
    description: Develop a high-level plot outline integrating vampires, elves, and
      Chris Pratt's character, structured around a three-act story arc.
    name: outline_basic_plot
    nodes_depended_on:
    - define_film_genre_and_tone
    - establish_film_setting
    - develop_vampire_character_details
    - develop_elf_character_details
    - determine_chris_pratt_character_profile
    nodes_dependent_on:
    - write_act_1_scenes
    - write_act_2_scenes
    - write_act_3_scenes
    prompt: Create a three-act plot outline for a screenplay about vampires, elves,
      and Chris Pratt's character. Define main conflicts, plot points, and story progression
      at a high level.
  write_act_1_scenes:
    agent: false
    description: Write detailed scenes for Act 1, establishing setting, characters,
      and initial conflict.
    name: write_act_1_scenes
    nodes_depended_on:
    - outline_basic_plot
    - develop_vampire_character_details
    - develop_elf_character_details
    - determine_chris_pratt_character_profile
    nodes_dependent_on:
    - write_act_2_scenes
    prompt: Write the screenplay scenes composing Act 1, introducing the world, main
      characters including Chris Pratt's, and the central conflict involving vampires
      and elves.
  write_act_2_scenes:
    agent: false
    description: Write detailed scenes for Act 2, developing conflict and character
      arcs.
    name: write_act_2_scenes
    nodes_depended_on:
    - write_act_1_scenes
    - outline_basic_plot
    - develop_vampire_character_details
    - develop_elf_character_details
    - determine_chris_pratt_character_profile
    nodes_dependent_on:
    - write_act_3_scenes
    prompt: Write the screenplay scenes composing Act 2, advancing the story's conflict
      and relationships, deepening the roles of vampires, elves, and Chris Pratt's
      character.
  write_act_3_scenes:
    agent: false
    description: Write detailed scenes for Act 3, resolving conflicts and concluding
      the story.
    name: write_act_3_scenes
    nodes_depended_on:
    - write_act_2_scenes
    - outline_basic_plot
    - develop_vampire_character_details
    - develop_elf_character_details
    - determine_chris_pratt_character_profile
    nodes_dependent_on:
    - compile_full_screenplay
    prompt: Write the screenplay scenes composing Act 3, concluding the plot, resolving
      conflicts, and providing a satisfying ending involving vampires, elves, and
      Chris Pratt's character.
