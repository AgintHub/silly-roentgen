dag_type: plain_text
description: Builds a WebAssembly compiler by sequentially implementing lexical analysis,
  parsing, semantic analysis, intermediate representation, optimization, and WebAssembly
  code generation, with parallel execution of implementation and testing phases.
name: write_web_assembly_compiler
nodes:
  definecompilerrequirements:
    agent: false
    description: Define the core requirements for the WebAssembly compiler including
      input language, supported features, and expected output format.
    name: definecompilerrequirements
    nodes_depended_on: []
    nodes_dependent_on:
    - designcompilerarchitecture
    prompt: Outline the specific requirements for a WebAssembly compiler, including
      source language (e.g., Rust, C++), target WebAssembly version, and key features
      to implement. Focus only on defining requirements, not implementation.
  designcompilerarchitecture:
    agent: false
    description: Create an architectural blueprint for the WebAssembly compiler components.
    name: designcompilerarchitecture
    nodes_depended_on:
    - definecompilerrequirements
    nodes_dependent_on:
    - implementlexer
    - implementparser
    - implementsemanticanalyzer
    - implementirgenerator
    - implementoptimizer
    - implementwebassemblygenerator
    - implementlinker
    prompt: Design the architectural structure of the WebAssembly compiler, specifying
      modules for lexical analysis, parsing, semantic analysis, IR generation, optimization,
      code generation, and linking. Focus only on modular design not implementation
      details.
  generatedocumentation:
    agent: false
    description: Create technical documentation for the compiler and its components.
    name: generatedocumentation
    nodes_depended_on:
    - validatecompiler
    nodes_dependent_on: []
    prompt: Produce comprehensive documentation covering the compiler architecture,
      API usage, implementation details, and usage examples.
  implementirgenerator:
    agent: false
    description: Convert validated ASTs into an intermediate representation format.
    name: implementirgenerator
    nodes_depended_on:
    - designcompilerarchitecture
    - implementsemanticanalyzer
    nodes_dependent_on:
    - implementoptimizer
    - implementwebassemblygenerator
    - writeirunittests
    prompt: Based on the compiler architecture and semantic analysis results, implement
      conversion of validated ASTs into a structured intermediate representation format.
  implementlexer:
    agent: false
    description: Implement the lexical analyzer/tokenizer for the source language.
    name: implementlexer
    nodes_depended_on:
    - designcompilerarchitecture
    nodes_dependent_on:
    - implementparser
    - writelexerunittests
    prompt: Based on the defined compiler architecture, implement the lexical analysis
      module for the source language. Focus only on tokenization functionality without
      downstream processing.
  implementlinker:
    agent: false
    description: Implement linking functionality for resolved external dependencies.
    name: implementlinker
    nodes_depended_on:
    - designcompilerarchitecture
    - implementwebassemblygenerator
    nodes_dependent_on:
    - writelinekerunittests
    prompt: Based on the compiler architecture and WebAssembly generator output, implement
      symbol resolution and final linking of the generated WebAssembly module.
  implementoptimizer:
    agent: false
    description: Apply optimization passes to the intermediate representation.
    name: implementoptimizer
    nodes_depended_on:
    - designcompilerarchitecture
    - implementirgenerator
    nodes_dependent_on:
    - writeoptimizerunittests
    prompt: Based on the compiler architecture and available IR generator, implement
      optimization passes such as dead code elimination and constant folding.
  implementparser:
    agent: false
    description: Implement the parser to convert tokens into abstract syntax trees.
    name: implementparser
    nodes_depended_on:
    - designcompilerarchitecture
    - implementlexer
    nodes_dependent_on:
    - implementsemanticanalyzer
    - writeparserunittests
    prompt: Based on the defined architecture and available lexer implementation,
      create a parser that constructs abstract syntax trees. Focus only on syntax
      validation and AST generation.
  implementsemanticanalyzer:
    agent: false
    description: Implement semantic analysis of parsed source code structures.
    name: implementsemanticanalyzer
    nodes_depended_on:
    - designcompilerarchitecture
    - implementparser
    nodes_dependent_on:
    - implementirgenerator
    - writesemanticunittests
    prompt: Based on the compiler architecture and available parser, implement semantic
      validation of abstract syntax trees including type checking and symbol resolution.
  implementwebassemblygenerator:
    agent: false
    description: Generate WebAssembly bytecode from optimized IR.
    name: implementwebassemblygenerator
    nodes_depended_on:
    - designcompilerarchitecture
    - implementirgenerator
    nodes_dependent_on:
    - implementlinker
    - writecodegenunittests
    prompt: Based on the compiler architecture and optimized IR, implement code generation
      targeting the WebAssembly binary format specifications.
  runallunittests:
    agent: false
    description: Execute all unit tests across compiler components.
    name: runallunittests
    nodes_depended_on:
    - writelexerunittests
    - writeparserunittests
    - writesemanticunittests
    - writeirunittests
    - writeoptimizerunittests
    - writecodegenunittests
    - writelinekerunittests
    nodes_dependent_on:
    - validatecompiler
    prompt: Execute all implemented unit tests for lexical analysis, parsing, semantic
      analysis, IR generation, optimization, WebAssembly generation, and linking modules.
  validatecompiler:
    agent: false
    description: Validate end-to-end compiler functionality through integration testing.
    name: validatecompiler
    nodes_depended_on:
    - runallunittests
    nodes_dependent_on:
    - generatedocumentation
    prompt: Perform end-to-end testing of the complete compiler workflow using sample
      source programs to validate correct WebAssembly output generation.
  writecodegenunittests:
    agent: false
    description: Create unit tests for WebAssembly code generation.
    name: writecodegenunittests
    nodes_depended_on:
    - implementwebassemblygenerator
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the WebAssembly code generator to
      validate proper translation of optimized IR into WebAssembly bytecode.
  writeirunittests:
    agent: false
    description: Create unit tests for the intermediate representation generator.
    name: writeirunittests
    nodes_depended_on:
    - implementirgenerator
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the IR generator to validate correct
      translation of validated ASTs into intermediate representations.
  writelexerunittests:
    agent: false
    description: Create unit tests for the lexical analysis component.
    name: writelexerunittests
    nodes_depended_on:
    - implementlexer
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the lexical analyzer module to verify
      tokenization correctness across valid and invalid input cases.
  writelinekerunittests:
    agent: false
    description: Create unit tests for the linker implementation.
    name: writelinekerunittests
    nodes_depended_on:
    - implementlinker
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the linker module to validate correct
      symbol resolution and module linkage.
  writeoptimizerunittests:
    agent: false
    description: Create unit tests for the optimization implementation.
    name: writeoptimizerunittests
    nodes_depended_on:
    - implementoptimizer
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the optimization module to verify
      correctness of transformations on intermediate representations.
  writeparserunittests:
    agent: false
    description: Create unit tests for the parser implementation.
    name: writeparserunittests
    nodes_depended_on:
    - implementparser
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the parser module to validate correct
      AST construction from various token sequences.
  writesemanticunittests:
    agent: false
    description: Create unit tests for the semantic analyzer.
    name: writesemanticunittests
    nodes_depended_on:
    - implementsemanticanalyzer
    nodes_dependent_on:
    - runallunittests
    prompt: Create comprehensive unit tests for the semantic analysis module to verify
      type checking and symbol resolution.
