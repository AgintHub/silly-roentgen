dag_type: plain_text
description: A highly concurrent workflow for designing and implementing a complete
  compiler, covering lexical analysis through code generation with parallelizable
  components.
name: compiler_development_workflow
nodes:
  apply_optimizations:
    agent: false
    description: Implement optimization transformations to the intermediate representation.
    name: apply_optimizations
    nodes_depended_on:
    - design_optimization_passes
    - design_intermediate_representation
    nodes_dependent_on:
    - design_code_emitter
    prompt: Implement the optimization passes in code. Include algorithms for optimizing
      IR sequences while preserving semantic equivalence.
  create_lexical_analyzer:
    agent: false
    description: Implement a lexical scanner that tokenizes the input source code.
    name: create_lexical_analyzer
    nodes_depended_on:
    - define_input_language_syntax
    nodes_dependent_on:
    - generate_parser
    prompt: Create a lexical analyzer that converts source code character sequences
      into tokens based on the defined syntax rules. Output code implementing regular
      expression-based tokenization.
  create_test_cases:
    agent: false
    description: Generate test programs to verify the compiler's accuracy.
    name: create_test_cases
    nodes_depended_on:
    - generate_code_emitter
    - define_input_language_syntax
    - define_target_language_semantics
    nodes_dependent_on:
    - implement_test_runner
    prompt: Create test programs that exercise all source language features. Include
      expected outputs in target code format for comparison.
  define_input_language_semantics:
    agent: false
    description: Document semantic rules for variable declarations, type systems,
      expressions, and control flow.
    name: define_input_language_semantics
    nodes_depended_on: []
    nodes_dependent_on:
    - design_ast_structure
    - implement_semantic_analyzer
    prompt: Define the semantic rules for the source language covering type systems,
      variable scoping, expression evaluation, and control flow behaviors. Provide
      formal operational or denotational semantics where appropriate.
  define_input_language_syntax:
    agent: false
    description: Specify the syntax rules for the source programming language, including
      keywords, operators, and structure.
    name: define_input_language_syntax
    nodes_depended_on: []
    nodes_dependent_on:
    - create_lexical_analyzer
    - design_parser_grammar
    prompt: Define the syntax rules for the source programming language. Specify keywords,
      literals, operators, and expression/declaration structures using BNF or EBNF
      notation. Focus exclusively on syntactic structure without semantic rules.
  define_target_language_semantics:
    agent: false
    description: Document how target language instructions translate to machine operations.
    name: define_target_language_semantics
    nodes_depended_on: []
    nodes_dependent_on:
    - design_code_emitter
    prompt: Specify the semantics of each target language instruction, including register
      usage, memory access, and execution behavior. Provide mappings to actual hardware
      operations.
  define_target_language_syntax:
    agent: false
    description: Establish syntax rules for the target machine code or intermediate
      representation.
    name: define_target_language_syntax
    nodes_depended_on: []
    nodes_dependent_on:
    - design_code_emitter
    prompt: Define the syntax format for the target language (e.g., assembly instructions,
      bytecode). Specify instruction opcodes, operand formats, and memory addressing
      schemes.
  design_ast_structure:
    agent: false
    description: Define data structures for representing abstract syntax during translation.
    name: design_ast_structure
    nodes_depended_on:
    - define_input_language_semantics
    - generate_parser
    nodes_dependent_on:
    - implement_semantic_analyzer
    - design_intermediate_representation
    prompt: Design a concrete AST node structure reflecting the source language's
      semantic requirements. Specify field types for each AST node category.
  design_code_emitter:
    agent: false
    description: Plan the code generation strategy from IR to target language.
    name: design_code_emitter
    nodes_depended_on:
    - apply_optimizations
    - define_target_language_syntax
    - define_target_language_semantics
    nodes_dependent_on:
    - generate_code_emitter
    prompt: Design code emission rules mapping IR operations to target language instructions.
      Specify instruction selection patterns and register allocation strategies.
  design_intermediate_representation:
    agent: false
    description: Define a simplified code representation for optimization and code
      generation.
    name: design_intermediate_representation
    nodes_depended_on:
    - implement_semantic_analyzer
    - define_input_language_semantics
    nodes_dependent_on:
    - design_optimization_passes
    - design_code_emitter
    prompt: Design a low-level intermediate representation (IR) format suitable for
      subsequent processing. Specify how source language constructs map to IR instructions.
  design_optimization_passes:
    agent: false
    description: Develop static code optimizations to improve the generated output.
    name: design_optimization_passes
    nodes_depended_on:
    - design_intermediate_representation
    nodes_dependent_on:
    - apply_optimizations
    prompt: Design optimization transformations for the IR including constant folding,
      dead code elimination, and register allocation strategies.
  design_parser_grammar:
    agent: false
    description: Define a formal grammar for the source language's syntactic structure.
    name: design_parser_grammar
    nodes_depended_on:
    - define_input_language_syntax
    nodes_dependent_on:
    - generate_parser
    prompt: Design a context-free grammar (CFG) for the source language. Present grammar
      productions using EBNF format suitable for parser implementation.
  generate_code_emitter:
    agent: false
    description: Implement the compiler component that converts optimized IR to target
      code.
    name: generate_code_emitter
    nodes_depended_on:
    - design_code_emitter
    - define_target_language_syntax
    - define_target_language_semantics
    nodes_dependent_on:
    - create_test_cases
    prompt: Implement the code generation component that turns optimized IR into executable
      target code. Include instruction selection, code layout, and binary encoding.
  generate_parser:
    agent: false
    description: Implement a parser that converts token streams into abstract syntax
      trees.
    name: generate_parser
    nodes_depended_on:
    - create_lexical_analyzer
    - design_parser_grammar
    nodes_dependent_on:
    - design_ast_structure
    - implement_semantic_analyzer
    prompt: Generate a parser implementation based on the defined grammar and lexical
      specifications. Output code for a recursive-descent or LR parser capable of
      building ASTs.
  generate_user_documentation:
    agent: false
    description: Create instructional materials for compiler developers and users.
    name: generate_user_documentation
    nodes_depended_on:
    - define_input_language_syntax
    - define_input_language_semantics
    - define_target_language_syntax
    - generate_code_emitter
    nodes_dependent_on: []
    prompt: Produce comprehensive documentation including language specifications,
      compiler architecture overview, and usage examples for both developers and end-users.
  implement_semantic_analyzer:
    agent: false
    description: Add type checking and symbol resolution to the compiler pipeline.
    name: implement_semantic_analyzer
    nodes_depended_on:
    - design_ast_structure
    - define_input_language_semantics
    nodes_dependent_on:
    - design_intermediate_representation
    prompt: Implement semantic analysis passes for the AST. Include type checking,
      symbol table management, and constraint validation based on the defined semantics.
  implement_test_runner:
    agent: false
    description: Build infrastructure to execute and verify test programs.
    name: implement_test_runner
    nodes_depended_on:
    - create_test_cases
    - generate_code_emitter
    nodes_dependent_on:
    - run_tests
    prompt: Implement test harness code that compiles test programs and verifies their
      behavior against expected outputs in the target environment.
  run_tests:
    agent: false
    description: Execute the test suite to validate compiler correctness.
    name: run_tests
    nodes_depended_on:
    - implement_test_runner
    nodes_dependent_on: []
    prompt: Execute the test suite and generate a report detailing pass/fail statuses
      for each test case. Include diagnostic info for any failures.
