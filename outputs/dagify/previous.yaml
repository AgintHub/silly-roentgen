dag_type: plain_text
description: A workflow that constructs a complete book of poetry from concept to
  distribution, handling theme definition, poem writing, editing, design, formatting,
  and marketing.
name: create_book_of_poetry
nodes:
  create_poem_collection_template:
    agent: false
    description: Creates a consistent structure and style guidelines for each poem
      in the collection.
    name: create_poem_collection_template
    nodes_depended_on:
    - define_book_scope
    nodes_dependent_on:
    - write_poem_1
    - write_poem_2
    - write_poem_3
    - write_poem_4
    - write_poem_5
    prompt: 'Based on the defined scope, outline a template for each poem: maximum
      line count, rhyme scheme (if any), style guidelines, and any required metadata
      (title, subtitle). Provide the template in a table format.'
  define_book_scope:
    agent: false
    description: Establishes the scope and core characteristics of the poetry book.
    name: define_book_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - create_poem_collection_template
    - design_cover
    - marketing_plan
    prompt: 'Identify the key parameters for the poetry book: number of poems, central
      theme, target audience, and intended publishing format. Provide a concise summary
      with bullet points.'
