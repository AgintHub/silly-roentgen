dag_type: plain_text
description: A highly concurrent DAG to plan and write a children's book about jungle
  animals, from audience and style decisions through outlines, five chapter drafts,
  glossary, illustration plan, final manuscript, and packaging.
name: write_jungle_animals_book_workflow
nodes:
  assemble_book_evidence_and_illustrations_plan:
    agent: false
    description: Devise an illustration plan and visual rationale per chapter.
    name: assemble_book_evidence_and_illustrations_plan
    nodes_depended_on:
    - create_animal_catalog
    - set_tone_and_style
    nodes_dependent_on: []
    prompt: Create an illustration plan per chapter including suggested scenes for
      illustrations, portrait ideas for animals, color palette notes, and how visuals
      reinforce learning points. Include a brief rationale for each chapter.
  compile_glossary_terms:
    agent: false
    description: Create a glossary of kid-friendly terms from the catalog and chapters.
    name: compile_glossary_terms
    nodes_depended_on:
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Generate a glossary of up to 20 terms derived from jungle animal topics
      with simple definitions and pronunciations.
  create_animal_catalog:
    agent: false
    description: Assemble a catalog of jungle animals to feature with key facts and
      hooks.
    name: create_animal_catalog
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Create a catalog of 12 jungle animals with for each: Name, KeyFacts (3-4
      bullets), StoryHook (one sentence), HabitatBrief (one sentence).'
  develop_book_outline:
    agent: false
    description: Produce a high-level 5-chapter outline aligned to audience, length,
      tone, and animal catalog.
    name: develop_book_outline
    nodes_depended_on:
    - set_target_audience
    - set_book_length
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Draft a 5-chapter outline for the jungle animals book. Include ChapterTitle,
      Objective, KeyLearningPoints (3 per chapter), and a brief StoryArc. Do not write
      full chapters yet.
  export_book_package:
    agent: false
    description: Prepare the final deliverables package for distribution or publication.
    name: export_book_package
    nodes_depended_on:
    - final_review_and_quality_check
    nodes_dependent_on: []
    prompt: 'Prepare the final book package: manuscript text, glossary, illustration
      plan, and formatting notes. Provide filenames and basic formatting guidelines.'
  final_review_and_quality_check:
    agent: false
    description: Perform a final quality check across manuscript, glossary, and illustration
      plan.
    name: final_review_and_quality_check
    nodes_depended_on:
    - write_draft_combined_manuscript
    - compile_glossary_terms
    - assemble_book_evidence_and_illustrations_plan
    nodes_dependent_on: []
    prompt: Review the assembled manuscript for coherence, factual accuracy, readability
      for the target audience, alignment with glossary terms, and consistency with
      the illustration plan. Provide a concise list of issues and recommended fixes.
  generate_chapter_titles:
    agent: false
    description: Create cohesive chapter titles derived from the outline.
    name: generate_chapter_titles
    nodes_depended_on:
    - develop_book_outline
    nodes_dependent_on: []
    prompt: From the outline, generate five chapter titles that fit the tone and flow.
      Output ChapterTitles as a list.
  set_book_length:
    agent: false
    description: Set the overall length and page estimate for the book.
    name: set_book_length
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Define the total word count range and approximate page count for the
      book. Provide: TotalWordCount and EstimatedPages.'
  set_target_audience:
    agent: false
    description: Define the target reader profile for the jungle animals book.
    name: set_target_audience
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Specify the target audience for a children''s book about jungle animals.
      Provide: AgeRange, ReadingLevel, and a single learning objective.'
  set_tone_and_style:
    agent: false
    description: Establish the narrative voice and stylistic guidelines for the book.
    name: set_tone_and_style
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Describe the narrative voice and style for the book. Provide Tone, VoiceGuidelines,
      and VocabularyLevel.
  write_chapter_1_draft:
    agent: false
    description: Write the full draft for Chapter 1 based on the outline, tone, and
      animal catalog.
    name: write_chapter_1_draft
    nodes_depended_on:
    - develop_book_outline
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Write Chapter 1 draft based on the outline and animal catalog. Include
      scene setup, first animal focus, and alignment with the learning objective.
  write_chapter_2_draft:
    agent: false
    description: Write the full draft for Chapter 2 based on the outline, tone, and
      animal catalog.
    name: write_chapter_2_draft
    nodes_depended_on:
    - develop_book_outline
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Write Chapter 2 draft based on the outline and animal catalog. Continue
      the story arc and learning points established in Chapter 1.
  write_chapter_3_draft:
    agent: false
    description: Write the full draft for Chapter 3 based on the outline, tone, and
      animal catalog.
    name: write_chapter_3_draft
    nodes_depended_on:
    - develop_book_outline
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Write Chapter 3 draft based on the outline and animal catalog. Introduce
      a new animal focus and reinforce learning points.
  write_chapter_4_draft:
    agent: false
    description: Write the full draft for Chapter 4 based on the outline, tone, and
      animal catalog.
    name: write_chapter_4_draft
    nodes_depended_on:
    - develop_book_outline
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Write Chapter 4 draft based on the outline and animal catalog. Build toward
      the story’s progression and learning outcomes.
  write_chapter_5_draft:
    agent: false
    description: Write the full draft for Chapter 5 based on the outline, tone, and
      animal catalog.
    name: write_chapter_5_draft
    nodes_depended_on:
    - develop_book_outline
    - set_tone_and_style
    - create_animal_catalog
    nodes_dependent_on: []
    prompt: Write Chapter 5 draft based on the outline and animal catalog. Provide
      a satisfying ending that reinforces learning objectives.
  write_draft_combined_manuscript:
    agent: false
    description: Assemble the five chapter drafts into a cohesive manuscript with
      smooth transitions.
    name: write_draft_combined_manuscript
    nodes_depended_on:
    - write_chapter_1_draft
    - write_chapter_2_draft
    - write_chapter_3_draft
    - write_chapter_4_draft
    - write_chapter_5_draft
    nodes_dependent_on: []
    prompt: Combine the five chapter drafts into a single manuscript, ensuring consistent
      voice and seamless transitions between chapters. Do not rewrite content; adjust
      for coherence and flow.
