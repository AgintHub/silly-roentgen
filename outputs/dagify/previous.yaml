dag_type: plain_text
description: A comprehensive research workflow for analyzing and writing an academic
  paper on Tolstoy's life, major works, and literary legacy with maximal concurrency
name: write_tolstoy_research_paper
nodes:
  analyzeliterarymovements:
    agent: false
    description: Connect Tolstoy to concurrent literary schools
    name: analyzeliterarymovements
    nodes_depended_on:
    - compilehistoricalcontext
    nodes_dependent_on:
    - developthesis
    prompt: Compare/contrast Tolstoy's realism/naturalism with Dostoevsky, Turgenev,
      and Chekhov
  compilehistoricalcontext:
    agent: false
    description: Document 19th century social/philosophical context
    name: compilehistoricalcontext
    nodes_depended_on:
    - gatherbiographicaldata
    nodes_dependent_on:
    - developthesis
    - analyzeliterarymovements
    prompt: List the key sociopolitical developments in Russia (1828-1910) that influenced
      Tolstoy's writing
  compilelistofworks:
    agent: false
    description: Create authoritative list of Tolstoy's major and minor works
    name: compilelistofworks
    nodes_depended_on: []
    nodes_dependent_on:
    - identifythemesinworks
    - performworkanalysis_ak
    - performworkanalysis_wp
    - conductliteraturereview
    prompt: List all novels, short stories, plays, and essays by Tolstoy with original
      Russian titles and English translations
  conductliteraturereview:
    agent: false
    description: Survey academic interpretations of Tolstoy's works
    name: conductliteraturereview
    nodes_depended_on:
    - compilelistofworks
    - identifythemesinworks
    nodes_dependent_on:
    - developthesis
    prompt: Summarize the three most cited critical perspectives on Tolstoy's major
      works
  developthesis:
    agent: false
    description: Formulate central argument for the paper
    name: developthesis
    nodes_depended_on:
    - gatherbiographicaldata
    - conductliteraturereview
    - identifythemesinworks
    nodes_dependent_on:
    - performworkanalysis_ak
    - performworkanalysis_wp
    - draftpaperoutline
    prompt: Create a thesis statement that links Tolstoy's life experiences to his
      narrative techniques and thematic concerns
  draftpaperoutline:
    agent: false
    description: Create structured paper architecture
    name: draftpaperoutline
    nodes_depended_on:
    - developthesis
    - performworkanalysis_ak
    - performworkanalysis_wp
    nodes_dependent_on:
    - writeabstract
    - writeconclusion
    prompt: 'Generate a 5-chapter outline with: introduction, biography, theme analysis,
      work analysis, legacy/conclusion'
  finalizereferences:
    agent: false
    description: Compile and format citation list
    name: finalizereferences
    nodes_depended_on:
    - conductliteraturereview
    - writeconclusion
    nodes_dependent_on: []
    prompt: Format all academic sources/primary texts using MLA style with hanging
      indents
  gatherbiographicaldata:
    agent: false
    description: Collect key biographical events and dates in Tolstoy's life
    name: gatherbiographicaldata
    nodes_depended_on: []
    nodes_dependent_on:
    - compilehistoricalcontext
    - developthesis
    prompt: List Tolstoy's birth/death dates, major life events, education, military
      service, and family background in chronological order
  identifythemesinworks:
    agent: false
    description: Extract recurring literary, philosophical, and moral themes
    name: identifythemesinworks
    nodes_depended_on:
    - compilelistofworks
    nodes_dependent_on:
    - performworkanalysis_ak
    - performworkanalysis_wp
    - developthesis
    prompt: Create a categorized list of recurring themes in Tolstoy's works including
      existential questions, social commentary, and spiritual explorations
  performworkanalysis_ak:
    agent: false
    description: Deep analysis of Anna Karenina
    name: performworkanalysis_ak
    nodes_depended_on:
    - compilelistofworks
    - developthesis
    nodes_dependent_on:
    - draftpaperoutline
    prompt: Analyze Anna Karenina's narrative structure, character dynamics, and thematic
      resonance with the formulated thesis
  performworkanalysis_wp:
    agent: false
    description: Deep analysis of War and Peace
    name: performworkanalysis_wp
    nodes_depended_on:
    - compilelistofworks
    - developthesis
    nodes_dependent_on:
    - draftpaperoutline
    prompt: Analyze War and Peace's historical realism, philosophical discourse, and
      structural innovations relevant to the thesis
  writeabstract:
    agent: false
    description: Create summary overview for paper
    name: writeabstract
    nodes_depended_on:
    - draftpaperoutline
    nodes_dependent_on: []
    prompt: Write a 200-word abstract summarizing the paper's thesis and methodology
  writeconclusion:
    agent: false
    description: Craft final summative section
    name: writeconclusion
    nodes_depended_on:
    - draftpaperoutline
    - performworkanalysis_ak
    - performworkanalysis_wp
    nodes_dependent_on:
    - finalizereferences
    prompt: Create a 3-paragraph conclusion that reiterates thesis, summarizes key
      findings, and suggests research directions
