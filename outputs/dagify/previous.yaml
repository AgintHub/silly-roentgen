dag_type: plain_text
description: A workflow for writing, designing, and compiling a full book including
  an outline, five chapters, cover art, blurb, and publication-ready formatting.
name: create_book
nodes:
  compile_final_book:
    agent: false
    description: Assemble all book components into final deliverable
    name: compile_final_book
    nodes_depended_on:
    - design_book_cover
    - create_book_blurb
    - format_chapters
    nodes_dependent_on: []
    prompt: Compile the final book by integrating the designed cover, formatted chapters,
      and book blurb into a completed manuscript file. Ensure all components align
      correctly in the final publication artifact.
  create_book_blurb:
    agent: false
    description: Develop a promotional blurb for the book
    name: create_book_blurb
    nodes_depended_on:
    - create_book_outline
    - write_chapter_1
    nodes_dependent_on: []
    prompt: Write a book blurb based on the outline and the first chapter. Highlight
      the central conflict, main characters, and the book's unique selling points.
  create_book_outline:
    agent: false
    description: Develop a detailed chapter-by-chapter outline for the book content
    name: create_book_outline
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Create a detailed outline for the book, including major plot points, character
      arcs, and thematic elements. Structure the outline into five chapters with brief
      summaries for each.
  design_book_cover:
    agent: false
    description: Generate a book cover based on content overview
    name: design_book_cover
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Design a cover for the book based on the provided outline. Include a title,
      author name, and an image that reflects the book's genre and themes.
  edit_chapter_1:
    agent: false
    description: Refine the first chapter content
    name: edit_chapter_1
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on: []
    prompt: Edit the first chapter for grammar, coherence, and alignment with the
      book's outline. Focus on tightening dialogue and refining character introductions.
  edit_chapter_2:
    agent: false
    description: Refine the second chapter content
    name: edit_chapter_2
    nodes_depended_on:
    - write_chapter_2
    nodes_dependent_on: []
    prompt: Edit the second chapter for consistency in plot progression and character
      development. Ensure narrative flow connects to the first chapter.
  edit_chapter_3:
    agent: false
    description: Refine the third chapter content
    name: edit_chapter_3
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on: []
    prompt: Edit the third chapter to resolve conflicts introduced in prior chapters
      and enhance thematic elements outlined in the book's overall structure.
  edit_chapter_4:
    agent: false
    description: Refine the fourth chapter content
    name: edit_chapter_4
    nodes_depended_on:
    - write_chapter_4
    nodes_dependent_on: []
    prompt: Edit the fourth chapter for narrative continuity, ensure character arcs
      are properly developed, and align story decisions with the overall plot outline.
  edit_chapter_5:
    agent: false
    description: Refine the fifth chapter content
    name: edit_chapter_5
    nodes_depended_on:
    - write_chapter_5
    nodes_dependent_on: []
    prompt: Edit the fifth chapter for narrative resolution, character arc completion,
      and ensure the conclusion satisfies the outlined plot structure.
  format_chapters:
    agent: false
    description: Prepare chapters for publication
    name: format_chapters
    nodes_depended_on:
    - edit_chapter_1
    - edit_chapter_2
    - edit_chapter_3
    - edit_chapter_4
    - edit_chapter_5
    nodes_dependent_on: []
    prompt: Format the edited chapters into a manuscript suitable for publication.
      Apply consistent styling for headings, margins, and pagination throughout all
      chapters.
  write_chapter_1:
    agent: false
    description: Produce the first chapter content
    name: write_chapter_1
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Write the first chapter of the book based on the provided outline. Focus
      on introducing the main characters and setting the narrative tone.
  write_chapter_2:
    agent: false
    description: Develop the second chapter content
    name: write_chapter_2
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Write the second chapter of the book based on the provided outline. Continue
      developing the plot and character relationships.
  write_chapter_3:
    agent: false
    description: Produce the third chapter content
    name: write_chapter_3
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Write the third chapter of the book based on the provided outline. Introduce
      conflicts and deepen character arcs.
  write_chapter_4:
    agent: false
    description: Develop the fourth chapter content
    name: write_chapter_4
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Write the fourth chapter of the book based on the provided outline. Develop
      plot twists and escalate character arcs.
  write_chapter_5:
    agent: false
    description: Produce the fifth chapter content
    name: write_chapter_5
    nodes_depended_on:
    - create_book_outline
    nodes_dependent_on: []
    prompt: Write the fifth chapter of the book based on the provided outline. Conclude
      the story with a satisfying ending.
