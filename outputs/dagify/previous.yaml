dag_type: plain_text
description: A workflow to create a personalized, context-aware 'hello' greeting message
  with concurrent elements
name: generate_hello_message
nodes:
  assemble_final_message:
    agent: false
    description: Combine all greeting elements into final output
    name: assemble_final_message
    nodes_depended_on:
    - generate_base_greeting
    - create_time_suffix
    - select_emoji
    nodes_dependent_on: []
    prompt: 'Create a final greeting message combining: 1) the base greeting from
      ''generate_base_greeting'', 2) the time suffix from ''create_time_suffix'',
      and 3) the emoji from ''select_emoji''. Format as: [Greeting] + [Time suffix]
      + [Emoji]'
  create_time_suffix:
    agent: false
    description: Add a time-dependent salutation
    name: create_time_suffix
    nodes_depended_on:
    - determine_current_time_period
    nodes_dependent_on:
    - assemble_final_message
    prompt: 'Generate a time-specific message based on the time period input. For
      morning input: ''Good morning!''. For afternoon: ''Good afternoon!''.'
  determine_current_time_period:
    agent: false
    description: Calculate the current time of day
    name: determine_current_time_period
    nodes_depended_on: []
    nodes_dependent_on:
    - create_time_suffix
    - select_emoji
    prompt: Determine the current time of day (e.g., morning, afternoon, evening,
      night). Return only the period name.
  generate_base_greeting:
    agent: false
    description: Create the foundational greeting phrase ('Hello')
    name: generate_base_greeting
    nodes_depended_on: []
    nodes_dependent_on:
    - assemble_final_message
    prompt: Generate the core greeting word or phrase. Focus on a simple, universal
      form like 'Hello', 'Hi', or 'Greetings'.
  select_emoji:
    agent: false
    description: Choose an appropriate visual accent
    name: select_emoji
    nodes_depended_on:
    - determine_current_time_period
    nodes_dependent_on:
    - assemble_final_message
    prompt: 'Select an emoji matching the time period from input. For morning: 🌅.
      For afternoon: ☀️. For evening: 🌇. For night: 🌙.'
