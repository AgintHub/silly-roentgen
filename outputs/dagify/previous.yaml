dag_type: plain_text
description: A workflow to assemble an all-star basketball team with no budget constraints,
  identifying and selecting top players for each position, defining team roles, and
  finalizing the roster.
name: build_all_star_basketball_team
nodes:
  assign_player_roles:
    agent: false
    description: Define specific roles and responsibilities for each selected player
      on the team.
    name: assign_player_roles
    nodes_depended_on:
    - select_point_guard
    - select_shooting_guard
    - select_small_forward
    - select_power_forward
    - select_center
    nodes_dependent_on:
    - finalize_team_roster
    prompt: Assign specific roles, playing style, and strategic responsibilities to
      each chosen player to maximize team synergy and performance.
  define_team_positions:
    agent: false
    description: List all basketball team positions needed for the all-star team roster.
    name: define_team_positions
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_best_point_guards
    - identify_best_shooting_guards
    - identify_best_small_forwards
    - identify_best_power_forwards
    - identify_best_centers
    prompt: Identify and list the standard basketball positions required for an all-star
      team roster, e.g., point guard, shooting guard, small forward, power forward,
      center.
  evaluate_centers:
    agent: false
    description: Evaluate and rate the top centers on key performance criteria for
      selection.
    name: evaluate_centers
    nodes_depended_on:
    - identify_best_centers
    nodes_dependent_on:
    - select_center
    prompt: Assess the listed top centers on rim protection, rebounding, scoring inside,
      physical presence, and fit for the team. Provide scores or qualitative ratings.
  evaluate_point_guards:
    agent: false
    description: Evaluate and rate the top point guards on key performance criteria
      for selection.
    name: evaluate_point_guards
    nodes_depended_on:
    - identify_best_point_guards
    nodes_dependent_on:
    - select_point_guard
    prompt: Assess the listed top point guards on criteria including scoring, assists,
      defense, leadership, and fit for the team. Provide scores or a qualitative rating.
  evaluate_power_forwards:
    agent: false
    description: Evaluate and rate the top power forwards on key performance criteria
      for selection.
    name: evaluate_power_forwards
    nodes_depended_on:
    - identify_best_power_forwards
    nodes_dependent_on:
    - select_power_forward
    prompt: Assess the listed top power forwards on rebounding, scoring, defense,
      physicality, and team role fit. Provide scores or qualitative ratings.
  evaluate_shooting_guards:
    agent: false
    description: Evaluate and rate the top shooting guards on key performance criteria
      for selection.
    name: evaluate_shooting_guards
    nodes_depended_on:
    - identify_best_shooting_guards
    nodes_dependent_on:
    - select_shooting_guard
    prompt: Assess the listed top shooting guards on scoring, shooting accuracy, defense,
      versatility, and team role fit. Provide scores or qualitative ratings.
  evaluate_small_forwards:
    agent: false
    description: Evaluate and rate the top small forwards on key performance criteria
      for selection.
    name: evaluate_small_forwards
    nodes_depended_on:
    - identify_best_small_forwards
    nodes_dependent_on:
    - select_small_forward
    prompt: Assess the listed top small forwards on scoring, defense, versatility,
      athleticism, and team synergy. Provide scores or qualitative ratings.
  finalize_team_roster:
    agent: false
    description: Compile the finalized all-star basketball team roster with assigned
      roles.
    name: finalize_team_roster
    nodes_depended_on:
    - assign_player_roles
    nodes_dependent_on: []
    prompt: Create the final roster list of the all-star basketball team including
      each player's name, position, and assigned role.
  identify_best_centers:
    agent: false
    description: Compile a list of the current best centers available in professional
      basketball.
    name: identify_best_centers
    nodes_depended_on:
    - define_team_positions
    nodes_dependent_on:
    - evaluate_centers
    prompt: Generate a ranked list of the top centers in professional basketball based
      on recent performance, skills, and accolades.
  identify_best_point_guards:
    agent: false
    description: Compile a list of the current best point guards available in professional
      basketball.
    name: identify_best_point_guards
    nodes_depended_on:
    - define_team_positions
    nodes_dependent_on:
    - evaluate_point_guards
    prompt: Generate a ranked list of the top point guards in professional basketball
      based on recent performance, skills, and accolades.
  identify_best_power_forwards:
    agent: false
    description: Compile a list of the current best power forwards available in professional
      basketball.
    name: identify_best_power_forwards
    nodes_depended_on:
    - define_team_positions
    nodes_dependent_on:
    - evaluate_power_forwards
    prompt: Generate a ranked list of the top power forwards in professional basketball
      based on recent performance, skills, and accolades.
  identify_best_shooting_guards:
    agent: false
    description: Compile a list of the current best shooting guards available in professional
      basketball.
    name: identify_best_shooting_guards
    nodes_depended_on:
    - define_team_positions
    nodes_dependent_on:
    - evaluate_shooting_guards
    prompt: Generate a ranked list of the top shooting guards in professional basketball
      based on recent performance, skills, and accolades.
  identify_best_small_forwards:
    agent: false
    description: Compile a list of the current best small forwards available in professional
      basketball.
    name: identify_best_small_forwards
    nodes_depended_on:
    - define_team_positions
    nodes_dependent_on:
    - evaluate_small_forwards
    prompt: Generate a ranked list of the top small forwards in professional basketball
      based on recent performance, skills, and accolades.
  select_center:
    agent: false
    description: Choose the best center for the team based on evaluations.
    name: select_center
    nodes_depended_on:
    - evaluate_centers
    nodes_dependent_on:
    - assign_player_roles
    prompt: Based on the evaluation scores, select the optimum center to fill the
      starting position on the all-star team.
  select_point_guard:
    agent: false
    description: Choose the best point guard for the team based on evaluations.
    name: select_point_guard
    nodes_depended_on:
    - evaluate_point_guards
    nodes_dependent_on:
    - assign_player_roles
    prompt: Based on the evaluation scores, select the optimum point guard to fill
      the starting position on the all-star team.
  select_power_forward:
    agent: false
    description: Choose the best power forward for the team based on evaluations.
    name: select_power_forward
    nodes_depended_on:
    - evaluate_power_forwards
    nodes_dependent_on:
    - assign_player_roles
    prompt: Based on the evaluation scores, select the optimum power forward to fill
      the starting position on the all-star team.
  select_shooting_guard:
    agent: false
    description: Choose the best shooting guard for the team based on evaluations.
    name: select_shooting_guard
    nodes_depended_on:
    - evaluate_shooting_guards
    nodes_dependent_on:
    - assign_player_roles
    prompt: Based on the evaluation scores, select the optimum shooting guard to fill
      the starting position on the all-star team.
  select_small_forward:
    agent: false
    description: Choose the best small forward for the team based on evaluations.
    name: select_small_forward
    nodes_depended_on:
    - evaluate_small_forwards
    nodes_dependent_on:
    - assign_player_roles
    prompt: Based on the evaluation scores, select the optimum small forward to fill
      the starting position on the all-star team.
