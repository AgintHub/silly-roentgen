dag_type: plain_text
description: A workflow for writing a novel styled as Shaq's diary, including concept
  development, character and setting creation, plot structuring, diary entries by
  chapters, and final compilation.
name: write_shaqqs_diary_novel
nodes:
  brainstorm_main_themes:
    agent: false
    description: Identify key themes and topics to weave throughout the diary novel.
    name: brainstorm_main_themes
    nodes_depended_on:
    - define_novel_perspective_and_tone
    nodes_dependent_on:
    - outline_novel_plot_structure
    prompt: List main themes and subjects (e.g., fame, sports, family, personal growth)
      that will be explored in Shaq's diary novel.
  compile_full_novel_draft:
    agent: false
    description: Combine all chapters' diary entries into a complete novel draft.
    name: compile_full_novel_draft
    nodes_depended_on:
    - write_chapter_1_entries
    - write_chapter_2_entries
    - write_chapter_3_entries
    - write_chapter_4_entries
    - write_chapter_5_entries
    nodes_dependent_on:
    - proofread_and_edit_draft
    prompt: Combine the diary entries from all chapters into one complete, smoothly
      flowing novel draft, keeping diary style consistent throughout.
  create_novel_setting:
    agent: false
    description: Define the primary settings and timeline of the novel.
    name: create_novel_setting
    nodes_depended_on:
    - define_novel_perspective_and_tone
    nodes_dependent_on:
    - outline_novel_plot_structure
    prompt: Describe the main settings (locations and timeframes) where Shaq's diary
      entries take place. Include relevant background details for vivid scene depiction.
  define_novel_perspective_and_tone:
    agent: false
    description: Define the narrative perspective and tone of Shaq's diary novel.
    name: define_novel_perspective_and_tone
    nodes_depended_on: []
    nodes_dependent_on:
    - develop_shaqq_character_profile
    - create_novel_setting
    - brainstorm_main_themes
    prompt: Determine the narrative perspective (first-person diary style) and the
      tone (e.g., humorous, reflective, casual) for the novel about Shaq's diary.
      Provide a clear statement summarizing them.
  develop_shaqq_character_profile:
    agent: false
    description: Create a detailed character profile for Shaq as the diary narrator.
    name: develop_shaqq_character_profile
    nodes_depended_on:
    - define_novel_perspective_and_tone
    nodes_dependent_on:
    - outline_novel_plot_structure
    prompt: Develop a detailed character profile for Shaq as the diary narrator, focusing
      on personality traits, voice style, and unique mannerisms to reflect in diary
      entries.
  generate_novel_title_and_blurb:
    agent: false
    description: Create a compelling title and a brief blurb summarizing the novel.
    name: generate_novel_title_and_blurb
    nodes_depended_on:
    - proofread_and_edit_draft
    nodes_dependent_on: []
    prompt: Based on the final edited draft, generate a creative title and a concise
      blurb that summarizes the essence of Shaq's diary novel appealingly.
  outline_novel_plot_structure:
    agent: false
    description: Create a chapter-by-chapter plot outline for the diary novel.
    name: outline_novel_plot_structure
    nodes_depended_on:
    - develop_shaqq_character_profile
    - create_novel_setting
    - brainstorm_main_themes
    nodes_dependent_on:
    - write_chapter_1_entries
    - write_chapter_2_entries
    - write_chapter_3_entries
    - write_chapter_4_entries
    - write_chapter_5_entries
    prompt: Develop a detailed chapter-by-chapter plot outline focusing on progression
      and key diary events reflecting Shaq's experiences and themes identified.
  proofread_and_edit_draft:
    agent: false
    description: Proofread and edit the compiled novel draft for style, consistency,
      grammar, and coherence.
    name: proofread_and_edit_draft
    nodes_depended_on:
    - compile_full_novel_draft
    nodes_dependent_on:
    - generate_novel_title_and_blurb
    prompt: Proofread the full novel draft of Shaq's diary. Edit for grammar, stylistic
      consistency, narrative flow, and character voice. Provide an improved, polished
      draft.
  write_chapter_1_entries:
    agent: false
    description: Write diary entries composing chapter 1 based on the outline and
      character profile.
    name: write_chapter_1_entries
    nodes_depended_on:
    - outline_novel_plot_structure
    nodes_dependent_on: []
    prompt: Compose the diary entries for chapter 1 of Shaq's diary novel. Emulate
      the established character voice, settings, and plot events specified in the
      outline.
  write_chapter_2_entries:
    agent: false
    description: Write diary entries composing chapter 2 based on the outline and
      character profile.
    name: write_chapter_2_entries
    nodes_depended_on:
    - outline_novel_plot_structure
    nodes_dependent_on: []
    prompt: Compose the diary entries for chapter 2 of Shaq's diary novel following
      the plot outline and maintaining character voice and tone.
  write_chapter_3_entries:
    agent: false
    description: Write diary entries composing chapter 3 based on the outline and
      character profile.
    name: write_chapter_3_entries
    nodes_depended_on:
    - outline_novel_plot_structure
    nodes_dependent_on: []
    prompt: Compose the diary entries for chapter 3 of Shaq's diary novel consistent
      with the plot outline, character voice, and established tone.
  write_chapter_4_entries:
    agent: false
    description: Write diary entries composing chapter 4 based on the outline and
      character profile.
    name: write_chapter_4_entries
    nodes_depended_on:
    - outline_novel_plot_structure
    nodes_dependent_on: []
    prompt: Compose the diary entries for chapter 4 of Shaq's diary novel using the
      plot outline and established narrative style.
  write_chapter_5_entries:
    agent: false
    description: Write diary entries composing chapter 5 based on the outline and
      character profile.
    name: write_chapter_5_entries
    nodes_depended_on:
    - outline_novel_plot_structure
    nodes_dependent_on:
    - compile_full_novel_draft
    prompt: Compose the diary entries for chapter 5 of Shaq's diary novel following
      the plot outline and narrative voice.
