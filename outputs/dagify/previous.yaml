dag_type: plain_text
description: A workflow to perform a generic test operation by defining test parameters,
  executing the test, capturing results, and summarizing output.
name: perform_simple_test
nodes:
  analyze_test_results:
    agent: false
    description: Interpret the test output to determine success criteria and highlight
      any failures or anomalies.
    name: analyze_test_results
    nodes_depended_on:
    - capture_test_results
    nodes_dependent_on:
    - summarize_test_results
    prompt: Review the captured test results to identify whether the test passed or
      failed and note any anomalies or issues. Provide a concise analysis summary.
  capture_test_results:
    agent: false
    description: Collect and format the raw output data produced by the test execution.
    name: capture_test_results
    nodes_depended_on:
    - execute_test
    nodes_dependent_on:
    - analyze_test_results
    prompt: Extract and organize all output generated from the test execution in a
      clear and structured format ready for analysis.
  define_test_parameters:
    agent: false
    description: Enumerate and describe all parameters required to run the defined
      test.
    name: define_test_parameters
    nodes_depended_on:
    - define_test_type
    nodes_dependent_on:
    - execute_test
    prompt: List all the parameters needed to execute the test specified. Provide
      parameter names, data types, and example values. Present as a bulleted list.
  define_test_type:
    agent: false
    description: Specify the type of test to be performed.
    name: define_test_type
    nodes_depended_on: []
    nodes_dependent_on:
    - define_test_parameters
    - execute_test
    prompt: Specify the precise type or nature of the test to run (e.g., functional
      test, performance test, unit test). Provide a clear, concise single-line description.
  execute_test:
    agent: false
    description: Run the test using the specified type and parameters.
    name: execute_test
    nodes_depended_on:
    - define_test_type
    - define_test_parameters
    nodes_dependent_on:
    - capture_test_results
    prompt: Execute the test defined by the provided test type and parameters. Confirm
      test initiation and completion, and produce raw output data as the result.
  summarize_test_results:
    agent: false
    description: Generate a final summary report about the test outcome.
    name: summarize_test_results
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    prompt: Produce a summary report that clearly states the test's success or failure
      status and key findings, suitable for stakeholders to review.
