dag_type: plain_text
description: A detailed workflow to collect, organize, and write a comprehensive biography
  of George W. Bush.
name: write_george_w_bush_biography
nodes:
  compile_biography_outline:
    agent: false
    description: Create a structured outline for the biography integrating all collected
      topics.
    name: compile_biography_outline
    nodes_depended_on:
    - research_political_career
    - research_presidency_major_events
    - research_personal_life
    nodes_dependent_on:
    - write_biography_text
    prompt: Create a detailed and chronological outline for the biography of George
      W. Bush, covering early life, education, military service, business career,
      political career, presidency, major events, and personal life.
  research_business_career:
    agent: false
    description: Compile information about George W. Bush's business activities prior
      to political career.
    name: research_business_career
    nodes_depended_on:
    - research_early_life
    nodes_dependent_on:
    - research_political_career
    prompt: Research George W. Bush's involvement in business ventures and activities
      before entering politics. Include company names, roles, and major accomplishments
      or controversies.
  research_early_life:
    agent: false
    description: Gather detailed information about George W. Bush's early life and
      family background.
    name: research_early_life
    nodes_depended_on: []
    nodes_dependent_on:
    - research_education
    - research_military_service
    - research_business_career
    prompt: Collect detailed information on George W. Bush's birth, family background,
      childhood experiences, and upbringing. Keep details factual and chronological.
  research_education:
    agent: false
    description: Collect data on George W. Bush's educational history including schools
      attended and degrees obtained.
    name: research_education
    nodes_depended_on:
    - research_early_life
    nodes_dependent_on:
    - research_political_career
    prompt: Gather information about George W. Bush's education, including where he
      attended school, university, and any special training or academic achievements.
      Present chronologically.
  research_military_service:
    agent: false
    description: Gather information about George W. Bush's military service record
      and related experiences.
    name: research_military_service
    nodes_depended_on:
    - research_early_life
    nodes_dependent_on:
    - research_political_career
    prompt: Collect historical and factual information on George W. Bush's service
      in the military, including branch, rank, duties, and notable events.
  research_personal_life:
    agent: false
    description: Gather information on George W. Bush’s personal life, including family,
      hobbies, and post-presidential activities.
    name: research_personal_life
    nodes_depended_on: []
    nodes_dependent_on:
    - compile_biography_outline
    prompt: Collect details on George W. Bush's personal life, including marriage,
      children, hobbies, philanthropy, and post-presidential endeavors.
  research_political_career:
    agent: false
    description: Collect detailed information about George W. Bush's political career,
      including offices held and major policies.
    name: research_political_career
    nodes_depended_on:
    - research_education
    - research_military_service
    - research_business_career
    nodes_dependent_on:
    - compile_biography_outline
    prompt: Gather comprehensive information on George W. Bush's political career,
      including gubernatorial and presidential tenures, key policies, major events,
      and election campaigns.
  research_presidency_major_events:
    agent: false
    description: Collect information specifically on major events and decisions during
      George W. Bush's presidency.
    name: research_presidency_major_events
    nodes_depended_on:
    - research_political_career
    nodes_dependent_on:
    - compile_biography_outline
    prompt: Compile major events, decisions, and controversies during George W. Bush's
      presidency such as 9/11, wars, economic policies, and domestic reforms.
  write_biography_text:
    agent: false
    description: Compose the full biography text of George W. Bush based on the compiled
      outline.
    name: write_biography_text
    nodes_depended_on:
    - compile_biography_outline
    nodes_dependent_on: []
    prompt: Using the detailed outline, write a comprehensive biography of George
      W. Bush. Include factual details, maintain chronological order, and ensure clear,
      engaging prose.
