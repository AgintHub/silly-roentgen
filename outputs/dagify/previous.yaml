dag_type: plain_text
description: A workflow for constructing a pirate-themed narrative including characters,
  setting, conflict, and resolution through parallel creation of world elements and
  plot components.
name: pirate_themed_narrative_creation
nodes:
  compile_narrative_chapters:
    agent: false
    description: Convert arcs into discrete segments
    name: compile_narrative_chapters
    nodes_depended_on:
    - plot_narrative_arc
    - define_narrative_scope
    nodes_dependent_on: []
    prompt: Break the 5-act narrative arc into 10 sequential chapters. Each chapter
      should correspond to 1-2 scenes, focusing on character development, plot progression,
      or environment challenges.
  create_confrontation_scenarios:
    agent: false
    description: Generate conflict sequences
    name: create_confrontation_scenarios
    nodes_depended_on:
    - create_nautical_challenges
    - establish_character_relations
    nodes_dependent_on:
    - plot_narrative_arc
    prompt: 'Write 3 key confrontation scenes: 1) haunted ship attack, 2) character
      betrayal during voyage, 3) final treasure confrontation. For each, state location,
      participants, and core skills tested.'
  create_crew_quarters:
    agent: false
    description: Design social spaces on ship
    name: create_crew_quarters
    nodes_depended_on:
    - design_ship
    - create_pirate_crew
    nodes_dependent_on:
    - develop_character_backstories
    prompt: Map the ship's living quarters including captain's cabin, mess hall, and
      3 distinct crew berthing areas. Note how each reflects the crew's hierarchy
      and cultural traits.
  create_fictional_map:
    agent: false
    description: Generate complete navigational map
    name: create_fictional_map
    nodes_depended_on:
    - create_setting
    nodes_dependent_on:
    - create_weather_patterns
    - create_treasure_map
    prompt: Produce a detailed fictional maritime map showing trade routes, reefs,
      and 6 key locations mentioned in the narrative. Include compass points and 2
      hidden landmarks (secret coves, downed ships).
  create_haunted_ship:
    agent: false
    description: Design spectral rival vessel
    name: create_haunted_ship
    nodes_depended_on:
    - create_treasure_map
    - design_ship
    nodes_dependent_on:
    - create_pirate_rituals
    prompt: 'Design a cursed ship as the main antagonist: describe its ghost crew
      origin, 3 haunted abilities (ghostly transformations, possession), and physical
      appearance (rotting planks, glowing features).'
  create_nautical_challenges:
    agent: false
    description: Generate voyage complication
    name: create_nautical_challenges
    nodes_depended_on:
    - create_weather_patterns
    - create_treasure_map
    nodes_dependent_on:
    - create_confrontation_scenarios
    prompt: 'Design 5 maritime challenges for the voyage: 2 natural (weather/creatures),
      2 mechanical (ship damage/mutiny), 1 metaphysical (haunted objects). Each should
      require different skills to resolve.'
  create_pirate_characters:
    agent: false
    description: Design main and supporting pirate characters
    name: create_pirate_characters
    nodes_depended_on:
    - define_narrative_scope
    nodes_dependent_on:
    - develop_character_backstories
    - create_pirate_crew
    prompt: Generate 3 main pirate characters with names, distinct traits (villain/ally/neutral),
      and unique abilities. Format as name | role | trait | ability table.
  create_pirate_crew:
    agent: false
    description: Build supporting cast members
    name: create_pirate_crew
    nodes_depended_on:
    - create_pirate_characters
    nodes_dependent_on:
    - establish_nautical_skills
    - create_crew_quarters
    prompt: Generate 15 supporting crew members with roles (sailor/doctor/boatswain)
      and 1 defining trait each. Include 3 characters with specialized skills (navigation/alchemy/blacksmithing).
  create_pirate_rituals:
    agent: false
    description: Develop cultural traditions
    name: create_pirate_rituals
    nodes_depended_on:
    - create_pirate_crew
    - create_haunted_ship
    nodes_dependent_on: []
    prompt: 'Define 4 pirate rituals/practices common to this crew: a secret handshake,
      treasure division ceremony, ghost appeasement ritual, and a toast phrase. Explain
      each''s historical significance.'
  create_setting:
    agent: false
    description: Develop fictional maritime world elements
    name: create_setting
    nodes_depended_on:
    - define_narrative_scope
    nodes_dependent_on:
    - create_fictional_map
    - design_ship
    prompt: 'Generate 3 key locations central to the pirate narrative: 1) harbor city,
      2) mysterious island, 3) danger zone. For each, list 2 defining features and
      1 unique hazard.'
  create_treasure_map:
    agent: false
    description: Design cartography for treasure finding
    name: create_treasure_map
    nodes_depended_on:
    - design_treasure
    - create_fictional_map
    nodes_dependent_on:
    - create_haunted_ship
    prompt: 'Construct a treasure map with 5 sequential waypoints from departure to
      treasure location. Include 3 cryptic clues to be solved en route. Format as
      numbered list with location: clue pairs.'
  create_weather_patterns:
    agent: false
    description: Establish environmental challenges
    name: create_weather_patterns
    nodes_depended_on:
    - create_fictional_map
    - define_narrative_scope
    nodes_dependent_on:
    - create_nautical_challenges
    prompt: Define 4 dangerous weather patterns (tempests, ghost winds) that affect
      specific regions from the fictional map. Describe their seasonal frequency and
      navigational hazards.
  define_narrative_scope:
    agent: false
    description: Establish core parameters for the pirate narrative
    name: define_narrative_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - create_pirate_characters
    - design_treasure
    - create_setting
    prompt: 'Define the scope of a pirate-themed narrative: genre (adventure/dark
      fantasy), time period (Age of Sail/modern), and core themes (betrayal/survival).
      Present as three bullet points.'
  design_ship:
    agent: false
    description: Create central vessel specifications
    name: design_ship
    nodes_depended_on:
    - create_setting
    nodes_dependent_on:
    - create_crew_quarters
    prompt: 'Define the lead pirate ship''s attributes: class (schooner/galleon),
      sailing capabilities, onboard weapons, and 3 unique modifications. Include a
      layout of 3 major decks.'
  design_treasure:
    agent: false
    description: Create narrative's central treasure or goal
    name: design_treasure
    nodes_depended_on:
    - define_narrative_scope
    nodes_dependent_on:
    - create_treasure_map
    prompt: Define the central treasure's nature (artifact/gold/secrets), its historical
      significance, and why it's sought. Limit to 3-5 sentences describing its physical
      appearance and mythical properties.
  develop_character_backstories:
    agent: false
    description: Create detailed histories for main characters
    name: develop_character_backstories
    nodes_depended_on:
    - create_pirate_characters
    nodes_dependent_on:
    - establish_character_relations
    prompt: 'For each main character, write a 100-word backstory explaining their
      transformation to piracy, key relationships, and personal motivations. Format
      as name: paragraph structure.'
  establish_character_relations:
    agent: false
    description: Define interpersonal dynamics
    name: establish_character_relations
    nodes_depended_on:
    - develop_character_backstories
    - create_pirate_crew
    nodes_dependent_on:
    - create_confrontation_scenarios
    prompt: 'Document key relationships between the main characters: 2 alliances,
      1 rivalry, 1 betrayal. For each, specify the nature of the bond and its narrative
      role.'
  establish_nautical_skills:
    agent: false
    description: Define seafaring competencies
    name: establish_nautical_skills
    nodes_depended_on:
    - create_pirate_crew
    nodes_dependent_on:
    - create_haunted_ship
    prompt: 'List 8 key competencies in pirate ship operation: sailing, shipbuilding,
      navigation, swordplay, etc. Assign each to 2-3 crew members from the pirate_crew
      list above.'
  plot_narrative_arc:
    agent: false
    description: Structure overall story progression
    name: plot_narrative_arc
    nodes_depended_on:
    - create_confrontation_scenarios
    nodes_dependent_on:
    - compile_narrative_chapters
    prompt: 'Create a 5-act narrative structure: 1) Gathering crew & ship, 2) Early
      voyage challenges, 3) Haunted ship emerges, 4) Major betrayal, 5) Final confrontation.
      Specify which confrontation scenes belong to each act.'
