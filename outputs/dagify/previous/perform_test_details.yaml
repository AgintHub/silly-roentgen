dag_type: plain_text
description: A workflow to perform a basic test operation consisting of defining test
  scope, preparing inputs, executing test actions, checking outcomes, and summarizing
  results.
name: perform_test
nodes:
  assess_test_results:
    agent: false
    description: Compare the documented test outcomes against the success criteria
      to determine pass/fail status.
    name: assess_test_results
    nodes_depended_on:
    - validate_test_outcome
    - define_success_criteria
    nodes_dependent_on:
    - summarize_test_findings
    prompt: Analyze the test results relative to the predefined success criteria.
      State if the test passes or fails, and explain why.
  define_success_criteria:
    agent: false
    description: Establish the criteria to determine if the test has passed or failed.
    name: define_success_criteria
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - assess_test_results
    prompt: List measurable criteria or conditions that indicate the test is successful
      or unsuccessful.
  define_test_scope:
    agent: false
    description: Specify the objective and scope of the test to be conducted.
    name: define_test_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - prepare_test_inputs
    - design_test_procedure
    - define_success_criteria
    prompt: Define clearly the goal and scope of the test you will perform, including
      what is being tested and the desired outcome.
  design_test_procedure:
    agent: false
    description: Detail the step-by-step procedure that will be followed to execute
      the test.
    name: design_test_procedure
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_test_actions
    prompt: Provide a clear, sequential procedure for performing the test as per the
      defined scope.
  execute_test_actions:
    agent: false
    description: Perform the actual test steps using the prepared inputs and following
      the designed procedure.
    name: execute_test_actions
    nodes_depended_on:
    - prepare_test_inputs
    - design_test_procedure
    nodes_dependent_on:
    - validate_test_outcome
    prompt: Execute all steps of the test procedure using the correct inputs and record
      observable actions or outputs.
  prepare_test_inputs:
    agent: false
    description: Gather or create all necessary inputs and data required to perform
      the test.
    name: prepare_test_inputs
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_test_actions
    prompt: Prepare and list all inputs, data, or resources needed to carry out the
      test based on the defined scope.
  summarize_test_findings:
    agent: false
    description: Produce a concise summary of the test process, results, and final
      conclusion.
    name: summarize_test_findings
    nodes_depended_on:
    - assess_test_results
    nodes_dependent_on: []
    prompt: Summarize the entire test including scope, procedure, input, outcome,
      success assessment, and final conclusion clearly and succinctly.
  validate_test_outcome:
    agent: false
    description: Capture and document the raw results or outputs generated from the
      test execution.
    name: validate_test_outcome
    nodes_depended_on:
    - execute_test_actions
    nodes_dependent_on:
    - assess_test_results
    prompt: Write down or collect all outputs, observations, or data produced by performing
      the test.
