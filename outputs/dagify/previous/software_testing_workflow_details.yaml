dag_type: plain_text
description: A workflow for executing comprehensive software testing across multiple
  layers, ensuring test case design, execution, and result analysis
name: software_testing_workflow
nodes:
  aggregate_test_results:
    agent: false
    description: Consolidate test execution outputs
    name: aggregate_test_results
    nodes_depended_on:
    - execute_unit_tests_module1
    - execute_unit_tests_module2
    - execute_integration_tests
    nodes_dependent_on:
    - generate_test_report
    prompt: 'Combine raw test outputs from all test suites into a standardized results
      format. Track: total tests, passed/failed counts, error types, and component-specific
      statistics.'
  analyze_test_coverage:
    agent: false
    description: Evaluate tested code portions
    name: analyze_test_coverage
    nodes_depended_on:
    - aggregate_test_results
    nodes_dependent_on:
    - generate_test_report
    prompt: Calculate code coverage metrics from test execution logs. Identify modules
      with <80% coverage and generate a priority list for additional testing.
  execute_integration_tests:
    agent: false
    description: Run system interaction tests
    name: execute_integration_tests
    nodes_depended_on:
    - write_integration_tests
    - set_up_test_environment
    nodes_dependent_on:
    - aggregate_test_results
    prompt: Execute the integration test suite in the configured test environment.
      Collect execution logs and failure analysis.
  execute_unit_tests_module1:
    agent: false
    description: Run unit tests for first module
    name: execute_unit_tests_module1
    nodes_depended_on:
    - write_unit_tests_module1
    - set_up_test_environment
    nodes_dependent_on:
    - aggregate_test_results
    prompt: Execute all unit tests for the first module module1 in the configured
      test environment. Collect execution logs and pass/fail status.
  execute_unit_tests_module2:
    agent: false
    description: Run unit tests for second module
    name: execute_unit_tests_module2
    nodes_depended_on:
    - write_unit_tests_module2
    - set_up_test_environment
    nodes_dependent_on:
    - aggregate_test_results
    prompt: Execute all unit tests for the second module module2 in the configured
      test environment. Collect execution logs and pass/fail status.
  generate_test_report:
    agent: false
    description: Create final test quality assessment
    name: generate_test_report
    nodes_depended_on:
    - aggregate_test_results
    - analyze_test_coverage
    nodes_dependent_on: []
    prompt: 'Produce a formal test quality report with: 1) Executive summary 2) Detailed
      metrics table 3) Component-specific failures 4) Coverage gaps 5) Recommended
      next steps. Format in markdown.'
  identify_testable_components:
    agent: false
    description: Enumerate distinct modules/functional units requiring testing
    name: identify_testable_components
    nodes_depended_on: []
    nodes_dependent_on:
    - install_testing_dependencies
    - write_unit_tests_module1
    - write_unit_tests_module2
    prompt: List all distinct functional components/modules in the software system
      that require testing (e.g., authentication module, payment processor, API gateway).
      Limit to 8-12 items with clear boundaries.
  install_testing_dependencies:
    agent: false
    description: Set up required testing frameworks and tools
    name: install_testing_dependencies
    nodes_depended_on: []
    nodes_dependent_on:
    - write_unit_tests_module1
    - write_unit_tests_module2
    - set_up_test_environment
    prompt: Install all required testing frameworks (e.g., Jest, PyTest) and tools
      (e.g., Postman, Selenium) for the system's stack. List installed packages and
      versions.
  set_up_test_environment:
    agent: false
    description: Configure isolated testing infrastructure
    name: set_up_test_environment
    nodes_depended_on:
    - install_testing_dependencies
    nodes_dependent_on:
    - execute_unit_tests_module1
    - execute_unit_tests_module2
    - execute_integration_tests
    prompt: Create a separate test environment with configured databases, mock services,
      and environment variables. Document environment setup steps and configurations.
  tear_down_test_environment:
    agent: false
    description: Clean up testing infrastructure
    name: tear_down_test_environment
    nodes_depended_on:
    - execute_integration_tests
    nodes_dependent_on: []
    prompt: 'Terminate all test environment components: destroy VMs, delete test databases,
      clear temporary files. Confirm environment is fully cleaned.'
  write_integration_tests:
    agent: false
    description: Create tests for system component interactions
    name: write_integration_tests
    nodes_depended_on:
    - identify_testable_components
    nodes_dependent_on:
    - execute_integration_tests
    prompt: Design integration test scenarios covering interactions between 2-3 key
      components from 'identify_testable_components'. Emphasize dependency validation.
  write_unit_tests_module1:
    agent: false
    description: Create unit tests for first module
    name: write_unit_tests_module1
    nodes_depended_on:
    - identify_testable_components
    - install_testing_dependencies
    nodes_dependent_on:
    - execute_unit_tests_module1
    prompt: Develop comprehensive unit tests for the first module/feature listed in
      'identify_testable_components'. Focus on edge cases and error conditions.
  write_unit_tests_module2:
    agent: false
    description: Create unit tests for second module
    name: write_unit_tests_module2
    nodes_depended_on:
    - identify_testable_components
    - install_testing_dependencies
    nodes_dependent_on:
    - execute_unit_tests_module2
    prompt: Develop comprehensive unit tests for the second module/feature listed
      in 'identify_testable_components'. Focus on edge cases and error conditions.
