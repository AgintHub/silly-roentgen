dag_type: plain_text
description: Runs a comprehensive test suite for a software project, including unit
  and integration tests, and produces a report.
name: software_test_workflow
nodes:
  clone_repository:
    agent: false
    description: Fetches the latest code from the version control system.
    name: clone_repository
    nodes_depended_on: []
    nodes_dependent_on:
    - setup_environment
    prompt: Clone the source code repository from the provided URL into the working
      directory.
  collect_results:
    agent: false
    description: Aggregates test results.
    name: collect_results
    nodes_depended_on:
    - run_unit_tests
    - run_integration_tests
    nodes_dependent_on:
    - aggregate_results
    prompt: Collect the output files from the unit and integration tests and combine
      them into a single consolidated results JSON.
  install_dependencies:
    agent: false
    description: Installs required libraries and tools.
    name: install_dependencies
    nodes_depended_on:
    - setup_environment
    nodes_dependent_on:
    - run_unit_tests
    - run_integration_tests
    prompt: Install all project dependencies defined in the package manager configuration
      files (e.g., pip install -r requirements.txt).
  run_integration_tests:
    agent: false
    description: Runs the integration test suite.
    name: run_integration_tests
    nodes_depended_on:
    - install_dependencies
    nodes_dependent_on:
    - collect_results
    prompt: Execute all integration tests for the project and produce a test results
      file in JUnit XML format.
  run_unit_tests:
    agent: false
    description: Runs the unit test suite.
    name: run_unit_tests
    nodes_depended_on:
    - install_dependencies
    nodes_dependent_on:
    - collect_results
    prompt: Execute all unit tests for the project and produce a test results file
      in JUnit XML format.
  setup_environment:
    agent: false
    description: Sets up an isolated environment for the test run.
    name: setup_environment
    nodes_depended_on:
    - clone_repository
    nodes_dependent_on:
    - install_dependencies
    prompt: Prepare a clean virtual environment suitable for building and testing
      the project (e.g., create a Docker container or virtualenv).
