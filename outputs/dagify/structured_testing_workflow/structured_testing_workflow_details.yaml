dag_type: plain_text
description: A highly concurrent testing workflow covering scope definition, environment
  setup, test design, execution, and reporting
name: structured_testing_workflow
nodes:
  analyze_test_results:
    agent: false
    description: Interpret test outcomes
    name: analyze_test_results
    nodes_depended_on:
    - execute_test_cases
    nodes_dependent_on:
    - generate_test_report
    prompt: Identify patterns in test failures, performance bottlenecks, and potential
      system interactions.
  define_test_case_categories:
    agent: false
    description: Classify testing requirements
    name: define_test_case_categories
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - design_individual_test_cases
    prompt: Create distinct testing categories covering functional, edge case, stress,
      regression, and acceptance testing types.
  define_test_criteria:
    agent: false
    description: Establish measurable validation standards
    name: define_test_criteria
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - define_test_cases
    - validate_test_outputs
    prompt: Define clear pass/fail criteria for all test categories including response
      time thresholds, accuracy metrics, and error tolerance levels.
  define_test_scope:
    agent: false
    description: Establish the boundaries and objectives for testing
    name: define_test_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - define_test_criteria
    - list_system_parameters
    prompt: Define what aspects need testing (e.g., system components, features, performance
      metrics) and establish the success criteria. Focus only on scope boundary definition.
  design_individual_test_cases:
    agent: false
    description: Create specific test procedures
    name: design_individual_test_cases
    nodes_depended_on:
    - define_test_criteria
    - define_test_case_categories
    - list_system_parameters
    nodes_dependent_on:
    - write_test_scripts
    - execute_test_cases
    prompt: Design specific test procedures for each category with defined inputs,
      expected outputs, and required system state.
  determine_test_environment:
    agent: false
    description: identify required test infrastructure
    name: determine_test_environment
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - setup_environment_configuration
    prompt: List all hardware, software, and network requirements needed for test
      execution. Include OS versions, server specs, and connectivity needs.
  execute_test_cases:
    agent: false
    description: Run automated test procedures
    name: execute_test_cases
    nodes_depended_on:
    - design_individual_test_cases
    - setup_test_data
    - setup_environment_configuration
    - write_test_scripts
    nodes_dependent_on:
    - analyze_test_results
    - validate_test_outputs
    prompt: Execute all test cases in the configured environment while capturing system
      responses and behavior logs.
  generate_test_report:
    agent: false
    description: Document findings
    name: generate_test_report
    nodes_depended_on:
    - validate_test_outputs
    - analyze_test_results
    nodes_dependent_on: []
    prompt: Synthesize all test results into standardized format including defect
      tracking numbers, status summary, and recommended next steps.
  list_system_parameters:
    agent: false
    description: Documentation of system configuration values
    name: list_system_parameters
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - define_test_cases
    - setup_test_data
    prompt: Create a comprehensive list of system parameters affecting test conditions
      and dependencies to be validated.
  setup_environment_configuration:
    agent: false
    description: Implement test infrastructure
    name: setup_environment_configuration
    nodes_depended_on:
    - determine_test_environment
    nodes_dependent_on:
    - write_test_scripts
    - execute_test_cases
    prompt: Configure test environment with specified hardware/software requirements
      and system parameters.
  setup_test_data:
    agent: false
    description: Prepare required test materials
    name: setup_test_data
    nodes_depended_on:
    - define_test_scope
    - define_test_case_categories
    - list_system_parameters
    nodes_dependent_on:
    - execute_test_cases
    - write_test_scripts
    prompt: Generate and organize all test data including fixture files, dummy records,
      and required input parameters.
  validate_test_outputs:
    agent: false
    description: Confirm results against expectations
    name: validate_test_outputs
    nodes_depended_on:
    - execute_test_cases
    - define_test_criteria
    nodes_dependent_on:
    - generate_test_report
    prompt: Compare actual outputs with defined criteria to identify pass/fail status
      and anomalies.
  write_test_scripts:
    agent: false
    description: Automate test procedures
    name: write_test_scripts
    nodes_depended_on:
    - design_individual_test_cases
    - setup_test_data
    - setup_environment_configuration
    nodes_dependent_on:
    - execute_test_cases
    prompt: Create executable test scripts for all designed test cases incorporating
      required data and environment configurations.
