dag_type: plain_text
description: A highly concurrent workflow for executing a comprehensive software testing
  process, from planning to validation with maximal parallelism
name: test_execution_dag
nodes:
  environment_setup:
    agent: false
    description: Configure test environments (hardware, software, network)
    name: environment_setup
    nodes_depended_on:
    - test_plan_review
    nodes_dependent_on:
    - test_execution
    prompt: List all hardware/software/network configurations needed for testing.
      Execute setup steps to reproduce a production-like test environment.
  final_approval:
    agent: false
    description: Obtain stakeholder sign-off for quality acceptance
    name: final_approval
    nodes_depended_on:
    - test_validation
    nodes_dependent_on: []
    prompt: Create checklist for stakeholder sign-off confirming business objectives
      met, risks documented, and next steps (production deployment or rework) specified.
  requirement_traceability_matrix:
    agent: false
    description: Map test cases to functional/technical requirements
    name: requirement_traceability_matrix
    nodes_depended_on:
    - test_plan_review
    nodes_dependent_on:
    - test_coverage_analysis
    prompt: 'Create a matrix cross-referencing each test case with specific requirements
      from the specification document. Format: Test Case ID | Requirement ID | Coverage
      Type (functional/non-functional)'
  test_case_development:
    agent: false
    description: Create test scenarios, inputs, and expected outcomes
    name: test_case_development
    nodes_depended_on:
    - test_plan_review
    nodes_dependent_on:
    - test_execution
    - requirement_traceability_matrix
    prompt: Generate 10-15 test scenarios with detailed inputs, preconditions, and
      expected results categorized by test type (functional, edge cases, regression
      tests).
  test_coverage_analysis:
    agent: false
    description: Measure percentage of requirements satisfied by test suite
    name: test_coverage_analysis
    nodes_depended_on:
    - test_execution
    - requirement_traceability_matrix
    nodes_dependent_on:
    - test_report_generation
    prompt: 'Calculate requirement coverage using the traceability matrix and test
      execution results. List: Total Requirements | Tested Requirements | % Coverage
      | Gaps'
  test_execution:
    agent: false
    description: Run automated/manual test scripts against SUT
    name: test_execution
    nodes_depended_on:
    - environment_setup
    - test_case_development
    nodes_dependent_on:
    - test_result_analysis
    - test_coverage_analysis
    prompt: 'Execute each test case and record pass/fail status with screenshots/log
      snippets for failed cases. Format results as: Test Case ID | Result (Pass/Fail)
      | Duration'
  test_plan_review:
    agent: false
    description: Review and finalize test scope, objectives, and constraints
    name: test_plan_review
    nodes_depended_on: []
    nodes_dependent_on:
    - environment_setup
    - test_case_development
    - requirement_traceability_matrix
    prompt: Review the test scope document and provide a confirmation (or rejection)
      of the testing objectives, budget, and timelines. State 'Approved' or 'Revisions
      Required' with a single paragraph rationale.
  test_report_generation:
    agent: false
    description: Aggregate test metrics into stakeholders' reports
    name: test_report_generation
    nodes_depended_on:
    - test_result_analysis
    - test_coverage_analysis
    nodes_dependent_on:
    - test_validation
    prompt: 'Create a summary report with: 1) Pass/Fail statistics 2) Issue distribution
      by severity 3) Coverage percentages 4) Recommendations for retesting/fixes'
  test_result_analysis:
    agent: false
    description: Classify, prioritize, and triage test failures
    name: test_result_analysis
    nodes_depended_on:
    - test_execution
    nodes_dependent_on:
    - test_report_generation
    prompt: Analyze failed test cases and categorize issues by severity (Critical/Major/Minor),
      impact, and component. Provide root cause analysis for Critical/Major failures
      only.
  test_validation:
    agent: false
    description: Verify test artifacts align with quality criteria
    name: test_validation
    nodes_depended_on:
    - test_report_generation
    nodes_dependent_on:
    - final_approval
    prompt: Verify completeness of test documentation, pass/fail criteria met, and
      coverage goals achieved. State 'Test Passes' or 'Test Fails' with 1-2 sentences
      justification.
